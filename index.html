<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anamika Anu 🎂 January 9</title>
<style>
:root{--bg:#fdf6f1;--card:#fffdfb;--ink:#34324f;--soft:#6b6985;--purple:#8e74d0;--lav:#e9e1f8;--peach:#fde0d3;--mint:#d8efe8;--sun:#fdebb8;--pink:#fbd9e3;--shadow:0 6px 20px rgba(120,100,170,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d2e;--card:#2a2840;--ink:#f3effc;--soft:#b9b4d4;--lav:#3b3560;--peach:#4a3434;--mint:#2f4440;--sun:#4a4230;--pink:#4a2f3d;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1d2e;--card:#2a2840;--ink:#f3effc;--soft:#b9b4d4;--lav:#3b3560;--peach:#4a3434;--mint:#2f4440;--sun:#4a4230;--pink:#4a2f3d;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
nav{margin:16px auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:980px}
nav b{font-size:1.1rem}nav b span{color:var(--purple)}
nav a{color:var(--ink);text-decoration:none;font-size:.85rem;margin-left:12px}
.hero{display:grid;gap:20px;align-items:center;padding:24px 0;text-align:center}
.badge{display:inline-block;background:var(--lav);color:var(--purple);border-radius:99px;padding:4px 14px;font-size:.85rem}
h1{font-size:clamp(2.2rem,9vw,4rem);line-height:1.1;margin:12px 0}
h1 span{color:var(--purple)}
.sub{color:var(--soft);max-width:480px;margin:0 auto 18px}
.btn{display:inline-block;background:var(--purple);color:#fff;border:0;border-radius:14px;padding:12px 24px;font-size:1rem;cursor:pointer;text-decoration:none;font-family:inherit;box-shadow:var(--shadow)}
.cake{font-size:7rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 10px;margin:10px 0 30px;text-align:center}
.count b{display:block;font-size:1.8rem;color:var(--purple)}.count small{color:var(--soft)}
.count p{grid-column:1/-1;margin:0;color:var(--soft);font-size:.9rem}
h2{text-align:center;margin:36px 0 4px;font-size:1.6rem}
.tag{text-align:center;color:var(--purple);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 18px;text-align:center}
.ic{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-size:2rem;margin:0 auto 10px}
.card h3{margin:6px 0}.card p{margin:0;color:var(--soft);font-size:.9rem}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:20px}
.ph{aspect-ratio:1;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:var(--shadow);border:3px dashed var(--purple);color:var(--soft)}
.ph small{font-size:.75rem;margin-top:4px}
.pick{background:var(--lav);border-radius:26px;padding:30px 20px;text-align:center;margin-top:20px}
#line{font-size:1.15rem;min-height:4.5em;display:flex;align-items:center;justify-content:center;margin:0 0 16px}
.letter{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:28px 22px;margin-top:20px;border-left:8px solid var(--pink)}
.letter p{margin:0 0 12px}
.cta{background:linear-gradient(135deg,var(--lav),var(--pink));border-radius:26px;padding:30px 20px;text-align:center;margin:40px 0 20px}
footer{text-align:center;color:var(--soft);font-size:.85rem;padding:20px 0 30px}
.fl{position:fixed;top:-30px;font-size:1.5rem;pointer-events:none;animation:fall 4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(max-width:520px){nav a{display:none}.cake{font-size:5.5rem}}
